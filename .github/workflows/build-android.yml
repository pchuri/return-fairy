name: build-android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Debug package guard tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Verify isolated test APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK=app/build/outputs/apk/debug/app-debug.apk
          REPORT=app/build/outputs/apk/debug/test-package-verification.txt
          echo "Built commit: $(git rev-parse HEAD)" > "$REPORT"
          python3 scripts/check_debug_package.py "$APK" \
            --aapt2 "$BUILD_TOOLS/aapt2" \
            --apkanalyzer "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" >> "$REPORT"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" >> "$REPORT"
          sha256sum "$APK" >> "$REPORT"
          cat "$REPORT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: return-fairy-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/test-package-verification.txt
          if-no-files-found: error

  # Push a tag like v4.0.1 (matching versionName) to publish a signed APK on GitHub Releases.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # SHA-256 of the release signing certificate. Every published APK must match it,
      # otherwise installed copies could not be updated.
      EXPECTED_CERT_SHA256: 0d5c7dd151cc81c4b38cbcee68d4e2c59005dd6581fd2c39036bd9941b5dd272
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches versionName
        run: |
          VERSION=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Secret SIGNING_KEYSTORE_BASE64 is not set" >&2
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          APK=app/build/outputs/apk/release/app-release.apk
          # The label differs by apksigner version ("Signer #1" / "V2 Signer"); take the first digest.
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 -oE 'certificate SHA-256 digest: [0-9a-f]+' | awk '{print $NF}')
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "Unexpected signing certificate: $ACTUAL" >&2
            exit 1
          fi
          mkdir -p dist
          cp "$APK" "dist/return-fairy-$VERSION.apk"
          (cd dist && sha256sum "return-fairy-$VERSION.apk" > "return-fairy-$VERSION.apk.sha256")

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "반납요정 $VERSION" \
            --notes "APK를 내려받아 설치하세요. 설치 방법은 README를 참고하세요. Signing certificate SHA-256: $EXPECTED_CERT_SHA256"
